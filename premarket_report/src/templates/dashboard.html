<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Premarket Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    tr:hover { background-color: #f9f9f9; }
    .small { font-size: 0.9em; color: #666; }
    .cell-bull { color: green; font-weight: 700; }
    .cell-bear { color: red; font-weight: 700; }
    .cell-none { color: #666; }
    a.cell-link { text-decoration: none; color: inherit; display:block; width:100%; height:100%; }
  </style>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  <script>
    const socket = io();
    socket.on('refresh', () => {
      location.reload();
    });
  </script>
</head>
<body>
  <h2>Premarket</h2>
   {% if table %}
    {{ table | safe }}
  {% else %}
    <p>No hay datos en la base de datos.</p>
  {% endif %}
  <p class="small">updated at: {{ updated_at }}</p>
</body>
</html>
